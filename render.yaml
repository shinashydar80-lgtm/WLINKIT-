services:
  - type: web
    name: wlinkit
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Add future private AI credentials in Render Dashboard > Environment.
      # Never put secret API keys in public/index.html or public/app.js.
